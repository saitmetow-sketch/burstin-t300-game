<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durak - Burstin T300</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { 
            margin: 0; padding: 0; background-color: #2e7d32; 
            font-family: Arial, sans-serif; overflow: hidden; 
            width: 100vw; height: 100vh; position: relative; 
        }

        .screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 15px; top: 0; left: 0;
        }
        .hidden { display: none !important; }

        /* Asosiy menyu (Siz yuborgan rasm uslubida) */
        #menu-screen {
            background: #2e7d32;
        }
        #left-sidebar {
            position: absolute; top: 10px; left: 10px; display: flex; 
            flex-direction: column; gap: 10px; z-index: 10;
        }
        .icon-btn {
            width: 55px; height: 55px; background: #fff; 
            border-radius: 10px; border: 3px solid #ffd700;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        #game-title {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            color: red; font-size: 65px; font-weight: bold; 
            text-shadow: 3px 3px 10px #000; letter-spacing: 2px;
        }
        
        /* Yuqori va pastki kartalar naqshlari (fon uchun) */
        .card-pattern-row {
            display: flex; gap: 15px; width: 100%; justify-content: center; opacity: 0.85;
        }
        .mini-card-bg {
            width: 70px; height: 100px; background: repeating-linear-gradient(45deg, #1b4d3e, #1b4d3e 10px, #2e7d32 10px, #2e7d32 20px);
            border: 2px solid #fff; border-radius: 6px; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        /* O'ng tarafdagi kolodka va ochiq kozir */
        #deck-container {
            position: absolute; right: 40px; top: 40%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 5px;
        }
        .deck-card {
            width: 70px; height: 100px; background: repeating-linear-gradient(45deg, #1b4d3e, #1b4d3e 10px, #2e7d32 10px, #2e7d32 20px);
            border: 2px solid #fff; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .trump-card {
            width: 70px; height: 100px; background: #fff; color: #d32f2f;
            border: 2px solid #000; border-radius: 6px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            font-weight: bold; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transform: rotate(90deg); margin-left: -35px; z-index: 2;
        }

        /* Pastki 4 ta asosiy tugma */
        .bottom-nav {
            display: flex; justify-content: center; gap: 15px; width: 100%; z-index: 10; margin-bottom: 5px;
        }
        .nav-btn {
            padding: 14px 28px; font-size: 18px; font-weight: bold; 
            cursor: pointer; border: 3px solid #000; background: white;
            border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .nav-btn:active { transform: scale(0.95); }
        #play-btn { background: #ffeb3b; }

        /* O'yin stoli ekkoni */
        #game-screen {
            background: #2e7d32;
            justify-content: space-between;
        }
        .table-center {
            width: 500px; height: 220px; background: radial-gradient(circle, #1b4d3e 0%, #0d281e 100%);
            border: 8px solid #4e342e; border-radius: 110px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .player-hand {
            display: flex; gap: 8px; justify-content: center; align-items: center;
        }
        .card {
            width: 65px; height: 95px; background: white; color: #333;
            border-radius: 6px; border: 2px solid #aaa; display: flex;
            flex-direction: column; justify-content: space-between; padding: 6px;
            font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .card.red { color: #d32f2f; }
        .card:hover { transform: translateY(-10px); }

        /* Status va xabarnomalar */
        #game-info-bar {
            background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px;
            color: #ffeb3b; font-weight: bold; font-size: 15px; border: 1px solid #ffd700;
        }

        /* Profil Modal */
        #profile-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; border: 3px solid #ffd700; padding: 25px; border-radius: 12px;
            display: none; flex-direction: column; gap: 15px; z-index: 100; width: 320px; text-align: center;
        }
        #profile-modal input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        .modal-btn { padding: 10px; background: #4caf50; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. ASOSIY MENYU -->
    <div id="menu-screen" class="screen">
        <div id="left-sidebar">
            <div id="profile-icon" class="icon-btn" onclick="openProfileModal()">👤</div>
            <div id="friends-icon" class="icon-btn" onclick="alert('Do\'stlar oynasi tez orada ochiladi!')">👥</div>
        </div>

        <div class="card-pattern-row">
            <div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div>
        </div>

        <div id="game-title">ДУРАК</div>

        <div id="deck-container">
            <div class="deck-card"></div>
            <div class="trump-card">6♥</div>
        </div>

        <div class="card-pattern-row">
            <div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div><div class="mini-card-bg"></div>
        </div>

        <div class="bottom-nav">
            <button id="play-btn" class="nav-btn" onclick="startDurakGame()">ИГРАТЬ</button>
            <button class="nav-btn" onclick="alert('Do\'kon bo\'limi')">МАГАЗИН</button>
            <button class="nav-btn" onclick="toggleSound()">ЗВУК ВКЛ</button>
            <button class="nav-btn" onclick="alert('Mastlar bo\'yicha saralandi')">СОРТ ПО МАСТИ</button>
        </div>
    </div>

    <!-- 2. O'YIN EKRANI -->
    <div id="game-screen" class="screen hidden">
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <button class="nav-btn" style="padding: 8px 15px; font-size: 14px;" onclick="returnToMenu()">Menyuga</button>
            <div id="game-info-bar">O'yin boshlandi: Kimda kichik kozir borligi aniqlanmoqda...</div>
            <div style="width: 80px;"></div>
        </div>

        <div class="table-center">
            <div style="color: #a5d6a7; font-weight: bold;">Zaxira va Kozir Stoli</div>
        </div>

        <!-- Sizning 6 ta kartangiz -->
        <div>
            <div style="text-align: center; color: #ffd700; margin-bottom: 5px; font-weight: bold;" id="player-name-display">Sizning kartalaringiz (6 ta)</div>
            <div class="player-hand" id="player-cards-container">
                <!-- Kartalar JavaScript orqali qo'shiladi -->
            </div>
        </div>
    </div>

    <!-- PROFIL MODAL -->
    <div id="profile-modal">
        <h3 style="color: #ffd700; margin: 0;">Profilni Sozlash</h3>
        <input type="text" id="username-input" value="O'yinchi_777" placeholder="Ismingizni kiriting">
        <input type="file" id="avatar-file" accept="image/*" style="color: white;">
        <button class="modal-btn" onclick="saveProfile()">Saqlash</button>
    </div>

    <script>
        let soundOn = true;

        function toggleSound() {
            soundOn = !soundOn;
            event.target.innerText = soundOn ? "ЗВУК ВКЛ" : "ЗВУК ОТКЛ";
        }

        function openProfileModal() {
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function saveProfile() {
            let newName = document.getElementById('username-input').value;
            if(newName) {
                document.getElementById('player-name-display').innerText = `${newName}ning kartalari (6 ta)`;
            }
            document.getElementById('profile-modal').style.display = 'none';
        }

        function returnToMenu() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        // Ovoz effekti uchun veb audio sintezi (faylsiz ovoz chiqarish)
        function playCardSound() {
            if (!soundOn) return;
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        // O'yinni boshlash va kuchli botlar bilan 6 ta karta tarqatish
        function startDurakGame() {
            playCardSound();
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            // Zo'r 6 ta karta generatsiya qilish
            let suits = ['♠', '♣', '♥', '♦'];
            let values = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
            let container = document.getElementById('player-cards-container');
            container.innerHTML = '';

            let playerCards = [];
            for(let i=0; i<6; i++) {
                let s = suits[Math.floor(Math.random() * suits.length)];
                let v = values[Math.floor(Math.random() * values.length)];
                playerCards.push({suit: s, value: v, isRed: (s === '♥' || s === '♦')});
            }

            // Kartalarni ekranga chiqarish
            playerCards.forEach(card => {
                let cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.isRed ? 'red' : ''}`;
                cardDiv.innerHTML = `<span>${card.value}${card.suit}</span><span style="font-size:22px; text-align:center;">${card.suit}</span><span style="transform:rotate(180deg);">${card.value}${card.suit}</span>`;
                cardDiv.onclick = () => {
                    playCardSound();
                    cardDiv.style.transform = 'translateY(-30px)';
                    setTimeout(() => cardDiv.remove(), 250);
                };
                container.appendChild(cardDiv);
            });

            // Kozir va birinchi yurishni aniqlash
            setTimeout(() => {
                let infoBar = document.getElementById('game-info-bar');
                infoBar.innerText = "🏆 Sizda eng kichik kozir (6♥) bor! O'yinni siz boshlaysiz.";
            }, 600);
        }
    </script>
</body>
</html>
